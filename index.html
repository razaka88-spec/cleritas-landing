<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order – Cleritas Pharma</title>

    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>

<body>

<header class="top-banner">
    <a href="/" aria-label="Homepage">
        <img src="assets/logo.png" class="logo" alt="Cleritas Pharma Logo">
    </a>

    <div class="lang-toggle">
        <button data-lang="en">EN</button>
        <button data-lang="so">SO</button>
    </div>
</header>

<main>
<section class="order-section">
    <h1 data-en="Place an Order" data-so="Dalbo Alaab">Place an Order</h1>

    <p data-en="Fill in the form below to order our products."
       data-so="Buuxi foomka hoose si aad u dalbato alaabteena.">
       Fill in the form below to order our products.
    </p>

    <form id="orderForm" class="order-form" novalidate>
        
        <label for="name" data-en="Full Name" data-so="Magacaaga">Full Name</label>
        <input id="name" name="name" type="text" required autocomplete="name">

        <label for="email" data-en="Email Address" data-so="Cinwaanka Email-ka">Email Address</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="phone" data-en="Phone Number" data-so="Lambarka Taleefanka">Phone Number</label>
        <input id="phone" name="phone" type="tel" required inputmode="tel" autocomplete="tel">

        <label for="product" data-en="Select Product" data-so="Dooro Alaabta">Select Product</label>
        <select id="product" name="product" required>
            <option value="Women’s Multivitamin">Women’s Multivitamin</option>
            <option value="Men’s Multivitamin">Men’s Multivitamin</option>
            <option value="Children’s Vitamins">Children’s Vitamins</option>
        </select>

        <label for="quantity" data-en="Quantity" data-so="Tirada">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="1" required>

        <label for="address" data-en="Delivery Address" data-so="Cinwaanka Gaarsiinta">Delivery Address</label>
        <textarea id="address" name="address" required></textarea>

        <button type="submit" class="submit-btn"
            data-en="Submit Order" data-so="Gudbi Dalabka">
            Submit Order
        </button>
    </form>

    <div id="formStatus" class="form-status"></div>

</section>
</main>

<footer>
    <p>© 2025 Cleritas Pharma</p>
</footer>


<script>
// ---------------------------------------------------------
// Language Toggle
// ---------------------------------------------------------
document.querySelectorAll(".lang-toggle button").forEach(btn =>
    btn.addEventListener("click", () => setLanguage(btn.dataset.lang))
);

function setLanguage(lang) {
    document.querySelectorAll("[data-en]").forEach(el => {
        el.innerText = el.getAttribute(`data-${lang}`);
    });
}


// ---------------------------------------------------------
// Order Form Submission
// ---------------------------------------------------------
document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const form = e.target;
    const status = document.getElementById("formStatus");
    status.innerText = "";

    const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        product: form.product.value,
        quantity: form.quantity.value,
        address: form.address.value.trim()
    };

    try {
        const response = await fetch("/api/order", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            status.innerText = "Your order has been submitted.";
            status.className = "form-status success";
            form.reset();
        } else {
            throw new Error("Server returned an error.");
        }

    } catch (err) {
        status.innerText = "Something went wrong. Please try again.";
        status.className = "form-status error";
    }
});
</script>

</body>
</html>
